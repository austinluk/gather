# Render Blueprint for the Gather backend.
# Render → New → Blueprint → select this repo. Fill the secret env vars when
# prompted (they are not stored in the repo).
services:
  - type: web
    name: gather-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: USE_MOCK_VENUES
        value: "false"
